version: 2

# Module 26 §8/§48. Dependency and workflow update monitoring.
#
# Grouped so that routine patch traffic arrives as a small number of reviewable
# pull requests rather than a stream that gets rubber-stamped. Major upgrades
# are deliberately excluded: Module 26 §45 requires that the Next 16 /
# next-intl 4 / Vitest 4 modernization be handled as its own module with a full
# regression, not as an incidental dependency bump during deployment.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    groups:
      production-patches:
        applies-to: version-updates
        dependency-type: production
        update-types: [patch, minor]
      development-patches:
        applies-to: version-updates
        dependency-type: development
        update-types: [patch, minor]
      # Security fixes are grouped separately so they are never buried in
      # routine version-update noise.
      security-updates:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Module 26 §45: major upgrades are a dedicated modernization module with
      # its own full regression, not incidental traffic during deployment.
      #
      # This was originally scoped to next, next-intl and vitest, which was too
      # narrow: the first Dependabot run immediately opened major PRs for
      # eslint 8 -> 10, typescript 5 -> 7 and tailwind-merge 2 -> 3, all of
      # which correctly failed CI and produced noise nobody was going to merge.
      # Security updates are unaffected by this rule and still arrive.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [ci, security]
    commit-message:
      prefix: 'ci'
